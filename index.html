<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      padding: 20px;
      background: #333;
      color: white;
      margin: 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

<h1>My Photo Gallery</h1>

<div class="gallery">

  <div class="gallery-item">
    <img src="https://picsum.photos/id/1015/600/400" alt="Image 1">
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/id/1016/600/400" alt="Image 2">
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/id/1018/600/400" alt="Image 3">
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/id/1020/600/400" alt="Image 4">
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/id/1024/600/400" alt="Image 5">
  </div>

  <div class="gallery-item">
    <img src="https://picsum.photos/id/1035/600/400" alt="Image 6">
  </div>

</div>

</body>
</html>
